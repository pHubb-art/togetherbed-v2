<title>Sleep Fit Tune-Up</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500;600;700&family=Gabarito:wght@500;700;800&display=swap">
<style>
/* Layout: black and white UI on paper; one full-bleed color stage of offset glass squircle stacks that shuffles with every answer.
   Phone: stage is a wide band on top, question below. Desktop: question left, stage fills the right half edge to edge. Single light look by choice (brand). */
:root {
  --ink: #231f20; --paper: #ffffff; --pillow: #fff7f1; --hair: #ece8e6; --soft: #f4f1ef; --mute: #57504f; --lift: 0 1px 2px rgb(35 31 32 / .07), 0 12px 26px -16px rgb(35 31 32 / .32);
  --apricot: #f6a47a; --rose: #eb86a6; --mulberry: #8e2f5e; --honey: #f4c866; --lilac: #b7a3d9;
  --head: "Gabarito", "Avenir Next", system-ui, sans-serif;
  --sans: "Albert Sans", "Avenir Next", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-l: 28px; --r-m: 18px; --ease: cubic-bezier(.2,.7,0,1);
  --gut-l: max(22px, env(safe-area-inset-left, 0px)); --gut-r: max(22px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--soft); color: var(--ink); font-family: var(--sans); font-size: 17px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.wrap { padding-left: var(--gut-l); padding-right: var(--gut-r); }

/* Header */
.top { background: var(--paper); display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-block: 10px; }
.top svg { height: 24px; flex: none; width: auto; display: block; color: var(--ink); }
.nav { display: flex; gap: 4px; }
.nav button { background: none; border: 0; padding: 7px 10px; border-radius: 999px; font-weight: 600; font-size: 14px; white-space: nowrap; }
.nav button[aria-current="true"] { background: var(--ink); color: #fff; }
.nav .ic { width: 36px; height: 36px; padding: 0; font-family: var(--head); font-weight: 800; font-size: 17px; background: var(--soft); }
#snd[aria-pressed="false"] { text-decoration: line-through; opacity: .55; }

.banner { background: var(--ink); color: #fff; font-size: 15px; padding-block: 10px; }

/* Play */
.play { display: grid; grid-template-columns: minmax(0, 1fr); }
.stage { position: relative; height: 138px; overflow: hidden; background: var(--pillow); isolation: isolate; }
.stack { position: absolute; width: 56%; aspect-ratio: 1; top: 50%; transform: translateY(-50%); }
.stack.k1 { left: -22%; } .stack.k2 { left: 22%; } .stack.k3 { left: 66%; }
.card { position: absolute; inset: 0; border-radius: 26%; corner-shape: squircle;
  background-color: var(--bg, transparent);
  background-image: linear-gradient(150deg, rgb(255 255 255 / .42), rgb(255 255 255 / 0) 38%, rgb(255 255 255 / 0) 70%, rgb(80 30 50 / .06));
  box-shadow: inset 12px 14px 22px -14px rgb(255 255 255 / .9), inset -14px -16px 26px -16px rgb(80 30 50 / .22), 0 26px 36px -24px rgb(80 30 50 / .38);
  translate: var(--x, 0) var(--y, 0); rotate: var(--r, 0deg);
  transition: translate 1.1s var(--ease), rotate 1.1s var(--ease), background-color 1s ease; }
.card.flip { animation: flip 1s var(--ease); }
@keyframes flip { 0% { transform: none; } 45% { transform: perspective(900px) rotateY(72deg) scale(.95); } 100% { transform: none; } }
.count { position: absolute; z-index: 2; left: var(--gut-l); bottom: 18px; display: grid; }
.count b { font-family: var(--head); font-weight: 800; font-size: 52px; line-height: .9; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.count b small { font-family: var(--sans); font-weight: 300; font-size: .5em; letter-spacing: 0; }
.count span { font-size: 14px; font-weight: 600; }
.pulse { position: absolute; z-index: 2; right: var(--gut-r); bottom: 20px; font-size: 13px; font-weight: 600; line-height: 1.35; width: 52%; display: grid; gap: 5px; }
.meter { position: relative; height: 12px; border-radius: 6px; background: rgb(255 255 255 / .75); overflow: hidden; }
.meter i { position: absolute; inset: 0 auto 0 0; border-radius: 6px; transition: width .6s var(--ease); }
.meter i.a { background: rgb(35 31 32 / .32); } .meter i.v { background: var(--ink); }
.meter.big { height: 18px; border-radius: 9px; background: #fff; } .meter.big i { border-radius: 9px; }
.key { display: flex; gap: 6px 18px; flex-wrap: wrap; font-size: 14.5px; font-weight: 600; }
.key u { display: inline-block; width: 12px; height: 12px; border-radius: 30%; margin-right: 6px; text-decoration: none; vertical-align: -1px; }
.pips { position: absolute; z-index: 2; left: 0; right: 0; bottom: 0; height: 6px; display: grid; grid-template-columns: repeat(20, 1fr); gap: 2px; }
.pips i { background: rgb(255 255 255 / .7); transition: background .3s; } .pips i.on { background: var(--ink); }
.pop { position: absolute; z-index: 3; left: var(--gut-l); bottom: 86px; font-family: var(--head); font-weight: 800; font-size: 30px; pointer-events: none; animation: pop 1.3s var(--ease) forwards; }
@keyframes pop { 0% { opacity: 0; translate: 0 14px; scale: .8; } 18% { opacity: 1; translate: 0 0; scale: 1.1; } 70% { opacity: 1; scale: 1; } 100% { opacity: 0; translate: 0 -34px; } }
.count b.bump { animation: bump .45s var(--ease); transform-origin: left bottom; }
@keyframes bump { 40% { transform: scale(1.12); } }
.scoreline { font-family: var(--head); font-weight: 800; font-size: clamp(64px, 17vw, 132px); line-height: .9; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.scoreline small { font-family: var(--sans); font-weight: 300; font-size: .26em; letter-spacing: 0; margin-left: .3em; }
.panel > * { animation: rise .35s var(--ease) both; }
@keyframes rise { from { opacity: .0; translate: 0 8px; } }
.trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.quad { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.trio { grid-template-columns: minmax(0, 1fr); } .trio .opt, .quad .opt { min-height: 68px; padding: 16px 18px; }
.trio .opt b, .quad .opt b { font-size: 21px; }
@media (min-width: 520px) { .trio { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.else { font-size: 15px; color: var(--mute); max-width: 58ch; }
.ansline { font-size: 18px; } .ansline b { font-family: var(--head); font-weight: 800; }
.board { display: grid; gap: 0; max-width: 560px; padding: 4px 18px; margin: 0; background: var(--paper); border-radius: var(--r-m); corner-shape: squircle; box-shadow: var(--lift); list-style: none; counter-reset: rank; }
.board li { counter-increment: rank; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto auto; gap: 14px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--hair); font-variant-numeric: tabular-nums; }
.board li:first-child { border-top: 0; }
.board li::before { content: counter(rank); font-family: var(--head); font-weight: 800; font-size: 20px; }
.board b { font-weight: 700; overflow-wrap: anywhere; } .board em { font-style: normal; font-size: 14px; color: var(--mute); } .board strong { font-family: var(--head); font-weight: 800; font-size: 20px; }
.h2 { font-family: var(--head); font-weight: 800; font-size: 24px; }

.panel { padding-block: 22px 48px; display: grid; gap: 16px; align-content: start; min-width: 0; }
.why-tag { justify-self: start; font-size: 13px; font-weight: 700; background: var(--ink); color: #fff; border-radius: 999px; padding: 3px 11px; }
.kicker { font-size: 16px; color: var(--mute); font-weight: 500; }
.qcard { background: var(--paper); border-radius: var(--r-l); corner-shape: squircle; padding: 22px 20px; display: grid; gap: 10px; box-shadow: var(--lift); min-width: 0; }
.big.sm { font-size: clamp(25px, 6.4vw, 40px); line-height: 1.08; }
.fact { font-size: 16.5px; font-weight: 600; }
.big { font-family: var(--head); font-weight: 800; font-size: clamp(31px, 8.2vw, 54px); line-height: 1.04; letter-spacing: -.02em; text-wrap: balance; }
.spec { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 16px; font-size: 16px; }
.spec dt { color: var(--mute); } .spec dd { margin: 0; font-weight: 600; }
.reason { font-size: 16px; max-width: 58ch; }
.ask { font-family: var(--head); font-weight: 800; font-size: 23px; line-height: 1.2; margin-top: 8px; text-wrap: balance; }
.ask + .kicker { margin-top: -10px; }
.duo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.opt { background: var(--paper); box-shadow: var(--lift); border: 0; border-radius: var(--r-l); corner-shape: squircle; padding: 20px 16px; min-height: 124px; display: grid; gap: 6px; align-content: center; text-align: left; transition: background .2s, color .2s, transform .2s var(--ease); }
.opt b { font-family: var(--head); font-weight: 800; font-size: clamp(20px, 5.2vw, 27px); line-height: 1.08; }
.opt span { font-size: 14.5px; line-height: 1.35; }
.opt:hover:not(:disabled) { background: var(--ink); color: #fff; transform: translateY(-2px); }
.opt[aria-pressed="true"] { background: var(--ink); color: #fff; }
.opt:disabled { cursor: default; } .opt:disabled:not([aria-pressed="true"]) { opacity: .45; }
.mid { display: flex; gap: 8px 22px; flex-wrap: wrap; align-items: center; }
.link { background: none; border: 0; padding: 6px 0; font-weight: 700; text-decoration: underline; text-underline-offset: 4px; }
.link.q { font-weight: 500; color: var(--mute); }
.link[aria-pressed="true"] { background: var(--ink); color: #fff; text-decoration: none; padding: 6px 14px; border-radius: 999px; }
.link:disabled { cursor: default; } .link:disabled:not([aria-pressed="true"]) { opacity: .4; }
.dial { position: relative; height: 34px; margin-top: 2px; }
.dial::before { content: ""; position: absolute; left: 0; right: 0; top: 8px; height: 6px; border-radius: 3px; background: var(--hair); }
.dial i { position: absolute; top: 2px; width: 4px; height: 18px; margin-left: -2px; border-radius: 2px; background: var(--ink); }
.dial i.team { background: var(--mulberry); width: 14px; height: 14px; margin-left: -7px; top: 4px; border-radius: 30%; transition: left .6s var(--ease); }
.dial u { position: absolute; top: 20px; font-size: 12px; text-decoration: none; color: var(--mute); font-variant-numeric: tabular-nums; }
.reveal { background: var(--paper); box-shadow: var(--lift); border-radius: var(--r-l); corner-shape: squircle; padding: 22px 20px; display: grid; gap: 12px; }
.reveal .btn { flex: 1 1 100%; padding-block: 16px; font-size: 17px; }
textarea.field { flex-basis: 100%; min-height: 92px; font-size: 13px; font-family: ui-monospace, Menlo, monospace; word-break: break-all; }
.reveal h3 { font-family: var(--head); font-weight: 800; font-size: 22px; line-height: 1.15; }
.reveal p { font-size: 16px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.field { flex: 1 1 200px; min-width: 0; font: inherit; padding: 13px 14px; border: 2px solid var(--ink); border-radius: 16px; corner-shape: squircle; background: #fff; color: var(--ink); }
.btn { background: var(--ink); color: #fff; border: 0; border-radius: 16px; corner-shape: squircle; padding: 14px 24px; font-weight: 700; font-size: 16px; }
.btn.ghost { background: none; color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
.btn:disabled { opacity: .4; cursor: default; }
.lead { font-size: 18px; max-width: 54ch; }
.steps { display: grid; gap: 10px; padding: 0; margin: 0; list-style: none; max-width: 56ch; }
.steps li { display: grid; gap: 2px; } .steps b { font-family: var(--head); font-size: 18px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.tile { background: var(--paper); box-shadow: var(--lift); border-radius: var(--r-m); corner-shape: squircle; padding: 16px; display: grid; gap: 2px; }
.tile b { font-family: var(--head); font-weight: 800; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.tile span { font-size: 14px; }

/* Results */
.hero { position: relative; overflow: hidden; background: var(--pillow); isolation: isolate; }
.hero .sq { position: absolute; width: max(46%, 300px); aspect-ratio: 1; border-radius: 28%; corner-shape: squircle; mix-blend-mode: multiply; z-index: -1; }
.hero .sq.a { background: var(--apricot); right: 8%; top: -34%; } .hero .sq.b { background: var(--rose); right: -18%; top: 4%; }
.hero-in { padding-block: 34px 30px; display: grid; gap: 20px; }
.hero h1, .doc h1 { font-family: var(--head); font-weight: 800; font-size: clamp(36px, 6vw, 72px); line-height: 1; letter-spacing: -.02em; }
.hero .tile { background: rgb(255 255 255 / .82); }
.tools { padding-block: 18px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { background: var(--paper); border: 0; border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: 14.5px; }
.chips button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.list { padding-bottom: 20px; }
.list { display: grid; gap: 10px; }
.r { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; padding: 18px; background: var(--paper); border-radius: var(--r-m); corner-shape: squircle; box-shadow: var(--lift); }
.r .id { font-size: 12.5px; font-weight: 700; color: var(--mute); font-variant-numeric: tabular-nums; }
.r .t b { display: block; font-weight: 700; } .r .t span { font-size: 15px; color: var(--mute); }
.r .nums { display: flex; gap: 6px 18px; flex-wrap: wrap; font-size: 15px; font-variant-numeric: tabular-nums; align-items: baseline; }
.r .nums em { font-style: normal; color: var(--mute); font-size: 13px; display: block; }
.r .team { font-weight: 700; }
.bar { height: 8px; border-radius: 4px; background: var(--hair); width: 110px; overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 8px; }
.bar i { display: block; height: 100%; background: var(--ink); }
.pill { font-size: 13px; font-weight: 700; border-radius: 999px; padding: 2px 10px; background: var(--soft); white-space: nowrap; }
.pill.strong { background: var(--ink); color: #fff; } .pill.split { background: var(--mulberry); color: #fff; }
.r .notes { font-size: 15px; color: var(--mute); }
.people { display: flex; gap: 6px; flex-wrap: wrap; }
.people span { background: var(--soft); border-radius: 999px; padding: 4px 12px; font-size: 14.5px; font-weight: 600; }
.foot { padding-block: 24px 60px; display: grid; gap: 14px; }
.empty { padding-block: 30px; color: var(--mute); }
.doc { padding-block: 30px 70px; display: grid; gap: 14px; }
.doc section { background: var(--paper); border-radius: var(--r-l); corner-shape: squircle; padding: 22px 20px; box-shadow: var(--lift); }
.doc h2 { font-family: var(--head); font-weight: 800; font-size: 26px; }
.doc section { display: grid; gap: 8px; max-width: 66ch; }

@media (min-width: 900px) {
  :root { --gut-l: max(44px, env(safe-area-inset-left, 0px)); --gut-r: max(44px, env(safe-area-inset-right, 0px)); }
  .top svg { height: 36px; } .nav button { font-size: 15.5px; padding: 8px 14px; }
  .card { -webkit-backdrop-filter: blur(3px) saturate(1.25); backdrop-filter: blur(3px) saturate(1.25); }
  .quad { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .trio .opt, .quad .opt { min-height: 104px; padding: 18px 18px; }
  .qcard, .reveal { padding: 30px 28px; }
  .duo .opt { min-height: 150px; padding: 26px 24px; }
  .r { grid-template-columns: 110px minmax(0, 1.5fr) minmax(0, 1.3fr) 250px; gap: 20px; align-items: start; }
  .r .notes { grid-column: 2 / -1; }
}
@media (prefers-reduced-motion: reduce) { .card, .opt, .meter i { transition: none; } .card.flip, .panel > *, .count b.bump { animation: none; } }

/* Glass pass: color stacks fill the whole screen behind everything; every piece of UI is a frosted pane, no outlines. */
:root { --glass: linear-gradient(150deg, rgb(255 255 255 / .80), rgb(255 255 255 / .58)); --glow: inset 0 1px 0 rgb(255 255 255 / .95), inset 0 -10px 18px -14px rgb(80 30 50 / .12), 0 16px 30px -20px rgb(80 30 50 / .5); }
body { background: var(--pillow); }
.top { background: rgb(255 255 255 / .72); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
.stage { position: fixed; inset: 0; height: auto; z-index: -1; }
.stack { width: 108vw; top: auto; transform: none; }
.stack.k1 { left: -34vw; top: -8vh; } .stack.k2 { left: 26vw; top: 30vh; } .stack.k3 { left: -22vw; top: 66vh; }
.qcard, .opt, .reveal, .tile, .board, .doc section, .hud, .chips button, .mid .link { background: var(--glass); box-shadow: var(--glow); -webkit-backdrop-filter: blur(18px) saturate(1.35); backdrop-filter: blur(18px) saturate(1.35); }
.opt[aria-pressed="true"], .chips button[aria-pressed="true"], .mid .link[aria-pressed="true"] { background: var(--ink); color: #fff; }
.mid .link { padding: 9px 16px; border-radius: 999px; text-decoration: none; color: var(--ink); font-size: 15.5px; }
.r { background: rgb(255 255 255 / .88); }
.play { padding-top: 14px; gap: 14px; }
.hud { position: relative; overflow: hidden; margin-left: var(--gut-l); margin-right: var(--gut-r); border-radius: var(--r-l); corner-shape: squircle; padding: 12px 18px 18px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 18px; align-items: center; }
.count, .pulse { position: static; width: auto; }
.count b { font-size: 42px; } .count span { font-size: 13.5px; white-space: nowrap; }
.meter { background: rgb(35 31 32 / .1); }
.pips i { background: rgb(35 31 32 / .12); }
.pop { left: auto; right: 16px; top: 4px; bottom: auto; font-size: 26px; }
.panel { padding-top: 0; padding-left: var(--gut-l); padding-right: var(--gut-r); }
.qcard .ask { margin-top: 10px; } .qcard .board { background: none; box-shadow: none; padding: 0; -webkit-backdrop-filter: none; backdrop-filter: none; }
h2.ask.solo { justify-self: start; background: var(--glass); box-shadow: var(--glow); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); padding: 8px 16px; border-radius: 999px; font-size: 19px; margin-top: 2px; }
.hero { background: none; } .hero .sq { display: none; }
.hero h1, .doc h1 { text-shadow: 0 1px 0 rgb(255 255 255 / .4); }
.nav .ic { background: rgb(35 31 32 / .07); }
@media (min-width: 900px) {
  .stack { width: auto; height: 86vh; }
  .stack.k1 { left: -8vw; top: 12vh; } .stack.k2 { left: 30vw; top: 4vh; } .stack.k3 { left: 66vw; top: 16vh; }
  .play { grid-template-columns: minmax(0, 700px) minmax(0, 1fr); min-height: calc(100dvh - 64px); padding-top: 0; }
  .panel { padding: 40px 30px 60px var(--gut-l); gap: 18px; align-content: center; }
  .hud { order: 2; align-self: end; justify-self: end; margin: 0 44px 44px 0; width: min(440px, 90%); padding: 22px 26px 30px; gap: 8px 24px; }
  .count b { font-size: 92px; } .count span { font-size: 16px; } .pulse { font-size: 15px; } .meter { height: 14px; }
  .pips { height: 8px; } .pop { font-size: 44px; right: 26px; top: 10px; }
}
/* A phone game everywhere: three choices side by side, and on big screens the game stays a phone-width column in the middle. */
.trio { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.trio .opt { text-align: center; padding: 14px 6px; min-height: 66px; }
.trio .opt b { font-size: clamp(17px, 4.9vw, 21px); } .trio .opt span { font-size: 13px; }
@media (min-width: 900px) {
  .play { grid-template-columns: minmax(0, 1fr); max-width: 500px; margin-inline: auto; min-height: 0; padding-top: 22px; }
  .hud { order: 0; align-self: auto; justify-self: stretch; width: auto; margin: 0 var(--gut-r) 0 var(--gut-l); padding: 12px 18px 18px; gap: 4px 18px; }
  .count b { font-size: 42px; } .count span { font-size: 13.5px; } .pulse { font-size: 13px; } .meter { height: 12px; }
  .panel { padding: 0 var(--gut-r) 60px var(--gut-l); align-content: start; }
  .quad { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .trio .opt, .quad .opt { min-height: 68px; } .trio .opt { padding: 14px 6px; }
  .qcard, .reveal { padding: 22px 20px; }
  .big { font-size: 40px; } .big.sm { font-size: 30px; }
  .pop { font-size: 26px; right: 16px; top: 4px; }
}
@media (prefers-reduced-transparency: reduce) { .qcard, .opt, .reveal, .tile, .board, .doc section, .hud, .chips button, .mid .link, h2.ask.solo { background: #fff; -webkit-backdrop-filter: none; backdrop-filter: none; } }
</style>

<header class="top wrap">
  __LOGO__
  <nav class="nav" aria-label="Sections">
    <button type="button" data-go="play">Play</button>
    <button type="button" data-go="results">Team</button>
    <button type="button" class="ic" data-go="how" aria-label="How it works">i</button>
    <button type="button" class="ic" id="snd" aria-pressed="true" aria-label="Sound">♪</button>
  </nav>
</header>
<div class="banner wrap" id="banner" hidden></div>

<div class="stage" id="stage" aria-hidden="true"><div class="stack k1"></div><div class="stack k2"></div><div class="stack k3"></div></div>
<main>
  <section class="play" id="v-play">
